[package]
name = "v2p-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
# Audio capture
cpal = "0.15"

# Speech-to-text (whisper.cpp bindings)
whisper-rs = "0.13"

# System tray
tray-icon = "0.19"

# Clipboard
arboard = "3.4"

# WAV encoding (for temp file whisper needs)
hound = "3.5"

# Argument parsing
clap = { version = "4", features = ["derive"] }

# HTTP client for model download
ureq = "2.12"
ctrlc = "3.4"
gtk = "0.18"
